# Docker Compose V2 - start with: docker compose up --build -d --wait
# Local-only service; no accounts or authentication are implemented.
services:
  speakly:
    build:
      context: .
      dockerfile: Dockerfile
    image: speakly-groq:2.3
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      APP_DATA_DIR: /data
      PYTHONUNBUFFERED: "1"
    volumes:
      # Keep the SQLite database across rebuilds; easy to migrate from v1/v2.
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
